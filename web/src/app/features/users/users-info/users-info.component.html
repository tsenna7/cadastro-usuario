<div class="card flex justify-center">
    <p-dialog header="Dados do usuário" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }">
        <section class="user-profile">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
                <div>
                    <p class="text-sm text-gray-500">Nome</p>
                    <p class="text-lg font-medium">{{ user.name }}</p>
                </div>

                <div>
                    <p class="text-sm text-gray-500">Sobrenome</p>
                    <p class="text-lg font-medium ">{{user.lastName}}</p>
                </div>

                <div>
                    <p class="text-sm text-gray-500">Gênero</p>
                    <p class="text-lg font-medium">{{ user.gender.name }}</p>
                </div>
            </div>

            <div class="border-t">
                <h3 class="text-xl font-semibold  pb-2 mb-4 mt-4">
                    Endereço
                </h3>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <p class="text-sm text-gray-500">CEP</p>
                        <p class="text-lg font-medium">{{ user.zipcode }}</p>
                    </div>

                    <div>
                        <p class="text-sm text-gray-500">Estado</p>
                        <p class="text-lg font-medium">{{ user.state }}</p>
                    </div>

                    <div>
                        <p class="text-sm text-gray-500">Cidade</p>
                        <p class="text-lg font-medium">{{ user.city }}</p>
                    </div>

                    <div>
                        <p class="text-sm text-gray-500">Rua</p>
                        <p class="text-lg font-medium">{{ user.street }}</p>
                    </div>

                    <div>
                        <p class="text-sm text-gray-500">Bairro</p>
                        <p class="text-lg font-medium">{{ user.neighbourhood }}</p>
                    </div>

                    <div>
                        <p class="text-sm text-gray-500">Número</p>
                        <p class="text-lg font-medium ">{{ user.number }}</p>
                    </div>

                    <div class="md:col-span-2">
                        <p class="text-sm text-gray-500">Complemento</p>
                        <p class="text-lg font-medium">{{ user.complement }}</p>
                    </div>
                </div>
            </div>
        </section>

        <div class="flex justify-end gap-2">
            <p-button label="Fechar e voltar para a lista" (click)="close.emit()" />
        </div>
    </p-dialog>
</div>
