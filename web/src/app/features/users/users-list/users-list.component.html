
<div class="flex; justify-end mb-4">
  <p-button label="Adicionar usuário" (onClick)="openDialog()" />

</div>


  <p-table [value]="users" [tableStyle]="{ 'min-width': '50rem' }" [loading]="loading()">
    <ng-template #header>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Sobrenome</th>
            <th>Gênero</th>
            <th class="w-16"></th>
        </tr>
    </ng-template>
    <ng-template #body let-user>
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.name }}</td>
            <td>{{user.lastName}}</td>
            <td>{{user.gender.name}}</td>
            <td>
                <div class="flex gap-2">
                    <p-button pTooltip="Editar" tooltipPosition="bottom" icon="pi pi-pencil" (onClick)="edit(user)" />
                    <p-button pTooltip="Remover" tooltipPosition="bottom" icon="pi pi-trash" (onClick)="remove(user)" />
                </div>

            </td>
        </tr>
    </ng-template>
  </p-table>
