<button pButton type="button" class="mb-4" (click)="backToList()">
    <span pButtonLabel>Voltar para a lista</span>
</button>

<app-users-info [user]="user()" *ngIf="showInfo" [visible]="showInfo" (close)="close()">

</app-users-info>
<p-tabs [(value)]="currentTab">
    <p-tablist>
        <p-tab [value]="0">Geral</p-tab>
        <p-tab [value]="1" [disabled]="disabledAddressTab">Endereço</p-tab>
    </p-tablist>
    <p-tabpanels>
        <p-tabpanel [value]="0">
            <form [formGroup]="form" (ngSubmit)="nextStep()" class="p-4">
                <div class="flex max-md:flex-col justify-between gap-2 mb-8">
                    <p-float-label class="w-1/3 max-md:w-full max-md:mb-4">
                        <input type="text" class="w-full" id="name" pInputText formControlName="name"/>

                        <label for="name">Nome</label>

                    </p-float-label>

                    <p-float-label class="w-1/3 max-md:w-full max-md:mb-4">
                        <input type="text" class="w-full" id="lastName" pInputText formControlName="lastName"/>

                        <label for="lastName">Sobrenome</label>

                    </p-float-label>

                    <p-select class="w-1/3 max-md:w-full" formControlName="gender" [options]="genders" optionLabel="name"
                              placeholder="Selecione o gênero"/>

                </div>



                <div class="flex justify-end max-md:justify-center">
                    <button pButton type="submit" class="max-md:w-full" [disabled]="!form.valid">
                        <span pButtonLabel>Continuar</span>
                    </button>
                </div>


            </form>

        </p-tabpanel>
        <p-tabpanel [value]="1">
            <form [formGroup]="addressForm" (ngSubmit)="save()" class="p-4">

                <div class="flex mb-8">
                    <p-float-label class="w-1/3 md:pr-4 max-md:w-full max-md:pr-4">
                        <input type="text" class="w-full" id="zipcode" pInputText pInputMask="99999-999" formControlName="zipcode"/>

                        <label for="zipcode">CEP</label>

                    </p-float-label>

                    <button pButton type="button" icon="pi pi-search" (click)="search()" [loading]="this.searchLoading()">
                        <span pButtonLabel>Buscar</span>
                    </button>
                </div>

                <div class="flex max-md:flex-col md:mb-8">

                    <p-float-label class="md:pr-4 w-1/3 max-md:w-full max-md:mb-8">
                        <input type="text" class="w-full" id="state" pInputText formControlName="state"/>

                        <label for="state">Estado</label>

                    </p-float-label>

                    <p-float-label class="md:pr-4 w-1/3 max-md:w-full max-md:mb-8">
                        <input type="text" class="w-full" id="city" pInputText formControlName="city"/>

                        <label for="city">Cidade</label>

                    </p-float-label>

                    <p-float-label class="w-1/3 max-md:w-full max-md:mb-8">
                        <input type="text" class="w-full" id="street" pInputText formControlName="street"/>

                        <label for="street">Rua</label>

                    </p-float-label>


                </div>

                <div class="flex  max-md:flex-col md:mb-8">

                    <p-float-label class="md:pr-4 w-1/3 max-md:w-full max-md:mb-8">
                        <input type="text" class="w-full" id="neighbourhood" pInputText formControlName="neighbourhood"/>

                        <label for="neighbourhood">Bairro</label>

                    </p-float-label>

                    <p-float-label class="md:pr-4 w-1/3 max-md:w-full max-md:mb-8">
                        <input type="number" class="w-full" id="number" pInputText formControlName="number"/>

                        <label for="number">Número</label>

                    </p-float-label>

                    <p-float-label class="w-1/3 max-md:w-full max-md:mb-8">
                        <input type="text" class="w-full" id="complement" pInputText formControlName="complement"/>

                        <label for="complement">Complemento</label>

                    </p-float-label>
                </div>

                <div class="flex justify-end gap-4">
                    <button pButton type="button" (click)="backStep()">
                        <span pButtonLabel>Voltar</span>
                    </button>

                    <button pButton type="submit" [disabled]="!addressForm.valid">
                        <span pButtonLabel>Salvar</span>
                    </button>
                </div>

            </form>
        </p-tabpanel>
    </p-tabpanels>
</p-tabs>
